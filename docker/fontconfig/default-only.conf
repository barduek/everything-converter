<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  fontconfig de WeasyPrint: FONTCONFIG_FILE=/opt/converter/fontconfig/default-only.conf.

  Solo ve la Fuente_Predeterminada (DejaVu Sans y DejaVu Sans Mono) en
  /opt/converter/fonts/default. No incluye /etc/fonts/fonts.conf, conf.d ni los directorios de
  fuentes del sistema o del usuario, así que los caracteres representables son exactamente los
  de los cmap de esos archivos (converter.converters.text_docs.layout.load_coverage, Req 6.11).
-->
<fontconfig>
  <dir>/opt/converter/fonts/default</dir>

  <!--
    Caché generada al construir la imagen con
    FONTCONFIG_FILE=/opt/converter/fontconfig/default-only.conf fc-cache -f.
    En ejecución solo se lee; si falta, fontconfig lee las fuentes del directorio.
  -->
  <cachedir>/opt/converter/fontconfig/cache</cachedir>

  <!-- Familias genéricas de CSS -->
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>

  <!-- Una familia que no está (por ejemplo, Arial) se reemplaza por sans-serif -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>
</fontconfig>
